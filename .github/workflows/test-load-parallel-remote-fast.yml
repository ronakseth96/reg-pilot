name: Remote Mode Fast Job
on:
  push:
    branches:
      - "feature/load-test-parallel"
  pull_request:
    branches:
      - "feature/load-test-parallel"
  workflow_dispatch:

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup_matrix.outputs.banks }}
    steps:
      - name: Set up matrix dynamic values
        id: setup_matrix
        run: |
          TOTAL_BANKS=81
          BANK_COUNT=40

          banks=()
          for ((i = 0; i < TOTAL_BANKS; i+=BANK_COUNT)); do
            first_bank=$((i + 1))
            bank_count=$((BANK_COUNT))
            
            # For the last bank, adjusting the count if it exceeds total banks
            if ((i + BANK_COUNT > TOTAL_BANKS)); then
              bank_count=$((TOTAL_BANKS - i))
            fi
            
            last_bank=$((first_bank + bank_count - 1))

            banks+=("{\"first_bank\": $first_bank, \"bank_count\": $bank_count, \"last_bank\": $last_bank, \"os\": \"ubuntu-latest\", \"node-version\": \"20\"}")
          done

          # banks_json='{"include":['"$(IFS=,; echo "${banks[*]}")"']}'
          banks_json="{\"include\":[$(IFS=,; echo "${banks[*]}")]}"
          echo "banks=${banks_json}" >> "$GITHUB_OUTPUT"

      - name: Print the output value
        env:
          banks_output: ${{ steps.setup_matrix.outputs.banks }}
        run: |
          echo "$banks_output"

  remote_fast:
    needs: setup_matrix
    name: Bank ${{ matrix.first_bank }}-${{ matrix.last_bank }} Load Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
        # os: ["ubuntu-latest"]
        # node-version: ["20"]
        # banks: [1, 41, 81, 121, 161, 201, 241, 281, 321, 341, 361, 401, 441, 481, 521, 561, 601]
        # bank_count: [40]
        # include: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: signify-ts-test/

    steps:
      - name: Debug Matrix Values
        run: |
        echo "First Bank: ${{ matrix.first_bank }}"
        echo "Last Bank: ${{ matrix.last_bank }}"
        echo "Bank Count: ${{ matrix.bank_count }}"
        echo "OS: ${{ matrix.os }}"
        echo "Node Version: ${{ matrix.node-version }}"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm set registry https://registry.npmjs.org/
          npm ci

      - name: Run test-load-parallel script for ${{ matrix.first_bank }} to ${{ matrix.last_bank }} in fast mode
        env:
          FIRST_BANK: ${{ matrix.first_bank }}
          LAST_BANK: ${{ matrix.last_bank }}
          BANK_COUNT: ${{ matrix.bank_count }}
          REMOTE_API_URL: ${{ vars.REMOTE_API_URL }}
        run: |
          chmod +x test-load-parallel.sh
          ./test-load-parallel.sh --mode remote --first-bank $FIRST_BANK --bank-count $BANK_COUNT --api-url $REMOTE_API_URL --fast
